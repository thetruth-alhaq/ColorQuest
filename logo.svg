<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Color Quest logo">
  <defs>
    <!-- 3D rainbow blob body -->
    <radialGradient id="body" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="18%" stop-color="#ffd93d"/>
      <stop offset="42%" stop-color="#ff9f1c"/>
      <stop offset="72%" stop-color="#f94144"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe8f4" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9761e"/>
      <stop offset="100%" stop-color="#8d4a08"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43e9e0"/>
      <stop offset="55%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#5f2eea"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f94144"/>
      <stop offset="25%" stop-color="#f8961e"/>
      <stop offset="50%" stop-color="#f9c74f"/>
      <stop offset="75%" stop-color="#43aa8b"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ground shadow (3D anchor) -->
  <ellipse cx="256" cy="452" rx="150" ry="26" fill="#1a0033" opacity="0.28" filter="url(#shadow)"/>

  <!-- rainbow splash ring behind the hero -->
  <g opacity="0.9">
    <circle cx="256" cy="240" r="208" fill="none" stroke="url(#drop)" stroke-width="14" stroke-dasharray="42 26" stroke-linecap="round"/>
  </g>

  <!-- blob hero, scaled to leave room for fish + Mozi -->
  <g transform="translate(56.3 52.8) scale(0.78)">
  <path d="M256 92
           C 330 92 396 142 410 214
           C 424 286 388 358 316 388
           C 244 418 158 396 118 336
           C 78 276 88 188 140 138
           C 172 106 214 92 256 92 Z"
        fill="url(#body)"/>

  <!-- paint drips off the blob -->
  <path d="M140 330 q-6 40 8 52 q14 -10 6 -52 Z" fill="#f8961e"/>
  <path d="M368 316 q10 34 -4 50 q-14 -12 -6 -50 Z" fill="#b5179e"/>

  <!-- belly light -->
  <ellipse cx="256" cy="300" rx="120" ry="82" fill="url(#belly)"/>

  <!-- specular shine (the 3D pop) -->
  <ellipse cx="190" cy="160" rx="72" ry="38" fill="url(#shine)" transform="rotate(-24 190 160)"/>

  <!-- eyes: big, glossy, kid-friendly -->
  <g>
    <ellipse cx="216" cy="238" rx="34" ry="40" fill="#ffffff"/>
    <ellipse cx="300" cy="238" rx="34" ry="40" fill="#ffffff"/>
    <circle cx="224" cy="244" r="17" fill="#3d348b"/>
    <circle cx="308" cy="244" r="17" fill="#3d348b"/>
    <circle cx="228" cy="238" r="6" fill="#ffffff"/>
    <circle cx="312" cy="238" r="6" fill="#ffffff"/>
  </g>

  <!-- blush -->
  <ellipse cx="172" cy="284" rx="18" ry="11" fill="#ff70a6" opacity="0.8"/>
  <ellipse cx="344" cy="284" rx="18" ry="11" fill="#ff70a6" opacity="0.8"/>

  <!-- open happy mouth with tongue -->
  <path d="M216 292 Q256 330 300 292 Q292 342 256 342 Q220 342 216 292 Z" fill="#7b1e3b"/>
  <ellipse cx="256" cy="326" rx="24" ry="12" fill="#ff6d8d"/>

  <!-- paintbrush in hand -->
  <g transform="rotate(18 380 330)">
    <rect x="368" y="250" width="26" height="112" rx="12" fill="url(#brush)"/>
    <path d="M368 356 h26 l6 58 q-19 16 -38 0 Z" fill="url(#bristle)"/>
    <circle cx="381" cy="432" r="10" fill="#43e9e0"/>
  </g>
  </g>

  <!-- crown of paint drops = "make it happen" magic -->
  <circle cx="140" cy="120" r="16" fill="#43e9e0"/>
  <circle cx="384" cy="112" r="13" fill="#f9c74f"/>
  <circle cx="432" cy="176" r="10" fill="#f94144"/>
  <circle cx="96" cy="200" r="10" fill="#43aa8b"/>
  <circle cx="256" cy="64" r="12" fill="#3a86ff"/>

  <!-- reef clownfish buddy (left) -->
  <g transform="translate(88 250) scale(1.35)">
    <polygon points="34,0 62,-20 62,20" fill="#ff8c42"/>
    <ellipse rx="42" ry="30" fill="#ff8c42"/>
    <path d="M-6 -28 L4 -30 L4 30 L-6 28 Z" fill="#ffffff"/>
    <ellipse rx="42" ry="30" fill="none" stroke="#d96a20" stroke-width="3"/>
    <circle cx="-16" cy="-6" r="8" fill="#ffffff"/>
    <circle cx="-14" cy="-6" r="4.5" fill="#2a1650"/>
    <circle cx="-12" cy="-8" r="1.6" fill="#ffffff"/>
    <path d="M-34 4 Q-26 10 -18 5" stroke="#a34712" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="10,-24 22,-32 18,-16" fill="#ffb75e"/>
    <polygon points="10,24 22,32 18,16" fill="#ffb75e"/>
  </g>

  <!-- blocky Mozi hero (right) -->
  <g transform="translate(428 238) scale(1.4)">
    <rect x="-18" y="-24" width="36" height="32" rx="5" fill="#e8b07a"/>
    <rect x="-18" y="-24" width="36" height="11" rx="5" fill="#6b4a2e"/>
    <rect x="-11" y="-8" width="9" height="8" fill="#ffffff"/>
    <rect x="3" y="-8" width="9" height="8" fill="#ffffff"/>
    <rect x="-9" y="-6" width="5" height="5" fill="#2a1650"/>
    <rect x="5" y="-6" width="5" height="5" fill="#2a1650"/>
    <rect x="-6" y="3" width="12" height="4" rx="2" fill="#a86f45"/>
    <rect x="-16" y="10" width="32" height="30" rx="5" fill="#3f7fc4"/>
    <rect x="-24" y="12" width="8" height="22" rx="4" fill="#e8b07a"/>
    <rect x="16" y="12" width="8" height="22" rx="4" fill="#e8b07a"/>
    <rect x="-15" y="40" width="13" height="20" fill="#3a6b9e"/>
    <rect x="2" y="40" width="13" height="20" fill="#3a6b9e"/>
  </g>

  <!-- "24 games in one" ribbon badge -->
  <g>
    <rect x="56" y="416" width="400" height="64" rx="32" fill="#2a1650" stroke="url(#drop)" stroke-width="6"/>
    <text x="256" y="460" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffd76a" letter-spacing="2">24 GAMES IN 1!</text>
  </g>
</svg>
